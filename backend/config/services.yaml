# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    openai.api_key: '%env(OPENAI_API_KEY)%'
    openai.default_model: 'gpt-4.1-mini'
    openai.model: '%env(default:openai.default_model:OPENAI_MODEL)%'
    openai.default_base_url: 'https://api.openai.com/v1'
    openai.base_url: '%env(default:openai.default_base_url:OPENAI_BASE_URL)%'
    openai.default_reasoning_effort: 'medium'
    openai.reasoning_effort: '%env(default:openai.default_reasoning_effort:OPENAI_REASONING_EFFORT)%'
    openai.default_text_verbosity: 'medium'
    openai.text_verbosity: '%env(default:openai.default_text_verbosity:OPENAI_TEXT_VERBOSITY)%'
    openai.default_max_output_tokens: '4000'
    openai.max_output_tokens: '%env(default:openai.default_max_output_tokens:OPENAI_MAX_OUTPUT_TOKENS)%'
    pilot.default_config_path: 'backend/config/intermarche-lyon.json'
    pilot.config_path: '%env(default:pilot.default_config_path:CONFIG_PATH)%'
    prompt.default_base_prompt_path: 'backend/config/prompt.md'
    prompt.base_prompt_path: '%env(default:prompt.default_base_prompt_path:SYSTEM_PROMPT_PATH)%'
    session.default_lifetime: 3600
    session.lifetime: '%env(int:default:session.default_lifetime:SESSION_LIFETIME)%'
    database.default_url: 'sqlite:///%kernel.project_dir%/var/app.sqlite'
    database.url: '%env(resolve:default:database.default_url:DATABASE_URL)%'
    session.migration_path: '%kernel.project_dir%/migrations/001_create_sessions.sql'
    chat_conversation.migration_path: '%kernel.project_dir%/migrations/002_create_chat_conversations.sql'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
    App\Infrastructure\OpenAi\OpenAiConfiguration:
        arguments:
            $apiKey: '%openai.api_key%'
            $model: '%openai.model%'
            $baseUrl: '%openai.base_url%'
            $reasoningEffort: '%openai.reasoning_effort%'
            $textVerbosity: '%openai.text_verbosity%'
            $maxOutputTokens: '%openai.max_output_tokens%'

    App\Infrastructure\OpenAi\OpenAiClientInterface:
        alias: App\Infrastructure\OpenAi\HttpOpenAiClient

    App\Infrastructure\PilotConfiguration\PilotConfigurationService:
        arguments:
            $configPath: '%pilot.config_path%'
            $projectDir: '%kernel.project_dir%'

    App\Infrastructure\SystemPrompt\SystemPromptAssemblyService:
        public: true
        arguments:
            $basePromptPath: '%prompt.base_prompt_path%'
            $projectDir: '%kernel.project_dir%'

    App\Infrastructure\Session\SessionConfiguration:
        arguments:
            $lifetimeSeconds: '%session.lifetime%'
            $databaseUrl: '%database.url%'

    App\Infrastructure\Session\SessionRepository:
        arguments:
            $migrationPath: '%session.migration_path%'

    App\Infrastructure\Chat\ChatConversationRepository:
        arguments:
            $migrationPath: '%chat_conversation.migration_path%'
